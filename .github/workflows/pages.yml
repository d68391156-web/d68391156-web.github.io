name: Publish Japan travel guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack verified static website
        run: |
          unzip -q japan-travel-independent-hosting.zip -d public-site
          base64 --decode currency-update.b64 > /tmp/currency-update.zip
          unzip -oq /tmp/currency-update.zip -d public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
